version: "3.9"

networks:
  mynetwork:
    driver: bridge

services:
  mysql:
    image: nrupad89/mysql:v1
    container_name: mysql
    networks:
      - mynetwork
    environment:
      MYSQL_ROOT_PASSWORD: pw123

  blue:
    image: nrupad89/webapp:v1
    container_name: blue
    networks:
      - mynetwork
    ports:
      - "8081:8080"
    environment:
      APP_COLOR: blue
      DBHOST: mysql
      DBPWD: pw123
      DATABASE: employees
      DBPORT: "3306"
      DBUSER: root
    depends_on:
      - mysql

  pink:
    image: nrupad89/webapp:v1
    container_name: pink
    networks:
      - mynetwork
    ports:
      - "8082:8080"
    environment:
      APP_COLOR: pink
      DBHOST: mysql
      DBPWD: pw123
      DATABASE: employees
      DBPORT: "3306"
      DBUSER: root
    depends_on:
      - mysql

  lime:
    image: nrupad89/webapp:v1
    container_name: lime
    networks:
      - mynetwork
    ports:
      - "8083:8080"
    environment:
      APP_COLOR: lime
      DBHOST: mysql
      DBPWD: pw123
      DATABASE: employees
      DBPORT: "3306"
      DBUSER: root
    depends_on:
      - mysql